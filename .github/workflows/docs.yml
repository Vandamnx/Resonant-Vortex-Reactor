name: Docs - TOC + Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  generate-toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate TOC
        uses: technote-space/toc-generator@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOC_TITLE: "## Table of Contents"
          TARGET_PATHS: "README*.md"
          MAX_HEADER_LEVEL: 3
          FOLDING: false
          COMMIT_MESSAGE: "docs: update table of contents [skip ci]"
          COMMIT_NAME: "GitHub Actions"
          COMMIT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

  markdown-lint:
    runs-on: ubuntu-latest
    needs: generate-toc
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"