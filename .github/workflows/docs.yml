name: Docs - TOC + Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  generate-toc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate TOC
        uses: technote-space/toc-generator@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOC_TITLE: "# Table of Contents"
          TARGET_PATHS: "README*.md"
          MAX_HEADER_LEVEL: 3
          FOLDING: false
          COMMIT_MESSAGE: "docs: update table of contents [skip ci]"
          COMMIT_NAME: "GitHub Actions"
          COMMIT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

  markdown-lint-and-fix:
    runs-on: ubuntu-latest
    needs: generate-toc
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Auto-fix markdown issues
        run: markdownlint-cli2 --fix "**/*.md" || true

      - name: Commit auto-fixes (if any)
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "GitHub Actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "docs: auto-fix markdownlint issues [skip ci]"
            git push
          else
            echo "No markdown fixes needed."
          fi

      - name: Final markdownlint check
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
