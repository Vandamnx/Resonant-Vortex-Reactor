name: Grok PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Grok Build Review
        uses: 0xr3ngar/grok-build-review-action@v1
        with:
          grok_auth_json: ${{ secrets.GROK_AUTH_JSON }}
          # Optional but recommended:
          roast_level: playful          # professional | playful | savage | diabolical
          fail_on: never                # never | bugs | any
          # status_comments: true       # already default
          # max_turns: 50               # already default